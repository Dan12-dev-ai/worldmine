name: World Mine Backend CI

on:
  push:
    branches: [main, develop, 'backend/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  backend-quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: worldmine
          POSTGRES_PASSWORD: worldmine_test
          POSTGRES_DB: worldmine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldmine -d worldmine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Compile Python sources
        run: |
          python -m compileall -q . \
            -x '(^|/)(.git|.venv|venv|node_modules|__pycache__|dist|build|test_env)(/|$)'

      - name: Ruff lint
        run: ruff check .

      - name: Bandit security scan
        run: bandit -r backend core services ai_agents -x tests -f json -o bandit-report.json
        continue-on-error: true

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Run backend unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://worldmine:worldmine_test@127.0.0.1:5432/worldmine_test
          REDIS_URL: redis://127.0.0.1:6379/0
          ENVIRONMENT: test
        run: |
          if [ -d tests/unit/backend ]; then
            pytest tests/unit/backend -q --disable-warnings --maxfail=1 --cov=backend --cov-report=term-missing
          else
            echo 'tests/unit/backend not present; failing CI rather than silently skipping backend tests.'
            exit 1
          fi

      - name: Run integration tests when present
        env:
          DATABASE_URL: postgresql+asyncpg://worldmine:worldmine_test@127.0.0.1:5432/worldmine_test
          REDIS_URL: redis://127.0.0.1:6379/0
          ENVIRONMENT: test
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration -q --disable-warnings --maxfail=1
          else
            echo 'No tests/integration directory found; unit/compile checks remain authoritative for this job.'
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-report
          path: bandit-report.json
          if-no-files-found: ignore

  backend-container-build:
    runs-on: ubuntu-latest
    needs: backend-quality-and-tests
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend container
        run: docker build -f Dockerfile.backend -t worldmine-backend-ci:${{ github.sha }} .
