# ==============================================
# WORLD-MINE DEVELOPMENT DOCKER COMPOSE
# Local development environment
# ==============================================

version: '3.8'

services:
  # ==============================================
  # BACKEND SERVICES
  # ==============================================
  
  worldmine-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: builder
    container_name: worldmine-api-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      - redis
      - postgres
    networks:
      - worldmine-network
    restart: unless-stopped

  # ==============================================
  # DATABASE & CACHING
  # ==============================================
  
  postgres:
    image: postgres:16-alpine
    container_name: worldmine-postgres-dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-worldmine}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-worldmine_dev}
      - POSTGRES_DB=${POSTGRES_DB:-worldmine_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - worldmine-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: worldmine-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - worldmine-network
    restart: unless-stopped

  # ==============================================
  # FRONTEND
  # ==============================================
  
  worldmine-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: builder
    container_name: worldmine-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - worldmine-api
    networks:
      - worldmine-network
    restart: unless-stopped

# ==============================================
# NETWORKS & VOLUMES
# ==============================================

networks:
  worldmine-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
