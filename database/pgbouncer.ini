# PgBouncer Configuration for DEDAN 2.0
# High-performance connection pooling for PostgreSQL

[databases]
# Database connection configurations
dedan_production = host=postgres-primary.dedan.ai port=5432 dbname=dedan user=dedan password=secure_password_2024
dedan_readonly = host=postgres-replica.dedan.ai port=5432 dbname=dedan user=readonly_user password=readonly_password_2024
dedan_analytics = host=postgres-analytics.dedan.ai port=5432 dbname=dedan user=analytics_user password=analytics_password_2024

[pgbouncer]
# Main PgBouncer configuration
listen_port = 6432
listen_addr = 127.0.0.1
unix_socket_dir = /var/run/pgbouncer
pidfile = /var/run/pgbouncer/pgbouncer.pid
admin_users = postgres, pgbouncer_admin
stats_users = stats_user, monitoring_user

# Connection pooling settings
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 10
max_db_connections = 200
max_user_connections = 100
server_reset_query = DISCARD ALL
server_check_delay = 5
server_check_query = SELECT 1
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 300
query_timeout = 300
query_wait_timeout = 120

# Advanced pooling settings
autocommit = off
ignore_startup_parameters = 1
track_extra_parameters = 1
connect_query = SET application_name='dedan_api', timezone='UTC'
application_name_add_host = 1
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

# Performance tuning
tcp_keepalive = 1
tcp_keepcnt = 9
tcp_keepidle = 600
tcp_keepintvl = 30
tcp_user_timeout = 300
tcp_defer_accept = 45
recv_buf_size = 8192
send_buf_size = 8192
bufsize = 8192

# TLS/SSL settings
tls_protocols = secure
tls_ciphers = HIGH:!aNULL:!MD5:!3DES
tls_prefer_server_ciphers = 1
client_tls_sslmode = require
server_tls_sslmode = require
tls_ca_file = /etc/ssl/certs/ca-cert.pem
tls_key_file = /etc/ssl/private/server-key.pem
tls_cert_file = /etc/ssl/certs/server-cert.pem

# Logging configuration
syslog = 1
syslog_facility = daemon
syslog_ident = pgbouncer
log_stats = 1
log_min_duration = 1000
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats_format = %t %p %b %c %m %U %Q %R

# User access control
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_hba_file = /etc/pgbouncer/hba.conf
auth_query = SELECT password FROM users WHERE username = '%u'

# Administrative access
admin_users = postgres, pgbouncer_admin
stats_users = stats_user, monitoring_user

# Statistics and monitoring
stats_period = 60
stats_users = stats_user, monitoring_user
stats_users_blacklist = postgres
show_unpooled_stats = 1
show_pool_usage = 1
show_database_usage = 1
show_peer_usage = 1

# Auto-ban settings
autoban = 1
autoban_min_seconds = 60
autoban_penalty_seconds = 3600
autoban_penalty_userlist = /etc/pgbouncer/banned_users.txt

# Connection limits
max_prepared_statements = 100
prepared_statement_cache_size = 1000
max_prepared_statements_per_connection = 25
track_extra_parameters = 1

# Health check settings
health_check_period = 10
health_check_timeout = 5
health_check_user = health_check
health_check_password = health_check
health_check_database = pgbouncer

# Load balancing
load_balance_hosts = round-robin
disable_auto_failover = 0
failover_timeout = 30
failover_restart_delay = 5

# Query cancellation
cancel_wait_timeout = 120
cancel_on_shutdowm = 1

# Memory management
mem_pool_size = 4096
mem_pool_timeout = 300
mem_pool_cleanup_delay = 60

# Connection validation
server_check_delay = 5
server_check_query = SELECT 1
server_reset_query = DISCARD ALL
server_lifetime = 3600
server_idle_timeout = 600

# Client settings
client_login_timeout = 60
client_query_timeout = 30
client_idle_timeout = 300

# Pool management
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 10
max_db_connections = 200
max_user_connections = 100

# Advanced features
pkt_buf = 4096
listen_backlog = 128
so_reuseport = 1
tcp_defer_accept = 45
tcp_socket_buffer = default
tcp_defer_accept = 45

# Monitoring and metrics
prometheus_stats = 1
prometheus_stats_port = 9127
prometheus_stats_namespace = pgbouncer
prometheus_stats_labels = environment=production,service=dedan_api

# Connection routing
route_pattern = ^dedan_(.*)
route_database = dedan_production
route_pool_size = 50

# Specialized pools for different workloads
[database_dedan_readonly]
pool_mode = session
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
max_db_connections = 100
server_reset_query = DISCARD ALL; SET SESSION CHARACTERISTICS AS READ ONLY;

[database_dedan_analytics]
pool_mode = statement
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
max_db_connections = 50
server_reset_query = DISCARD ALL;
connect_query = SET application_name='dedan_analytics', timezone='UTC', statement_timeout='30000';

# Connection timeouts and retries
connect_timeout = 10
login_timeout = 60
query_timeout = 300
query_wait_timeout = 120
cancel_wait_timeout = 120

# Resource limits
max_prepared_statements = 1000
prepared_statement_cache_size = 10000
track_extra_parameters = 1
track_activity_query_size = 2048

# Performance monitoring
log_min_duration = 1000
log_slow_queries = 1
slow_query_threshold = 5000
log_long_queries = 1
long_query_threshold = 30000

# Connection quality
tcp_keepalive = 1
tcp_keepcnt = 9
tcp_keepidle = 600
tcp_keepintvl = 30
tcp_user_timeout = 300
tcp_defer_accept = 45

# Buffer tuning
pkt_buf = 8192
listen_backlog = 256
so_reuseport = 1
tcp_socket_buffer = default
tcp_defer_accept = 45

# Security settings
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_hba_file = /etc/pgbouncer/hba.conf
auth_query = SELECT password FROM users WHERE username = '%u'
client_tls_sslmode = require
server_tls_sslmode = require
tls_protocols = secure
tls_ciphers = HIGH:!aNULL:!MD5:!3DES

# Logging and monitoring
syslog = 1
syslog_facility = daemon
syslog_ident = pgbouncer
log_stats = 1
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats_format = %t %p %b %c %m %U %Q %R
log_min_duration = 1000
log_slow_queries = 1
slow_query_threshold = 5000

# Administrative settings
admin_users = postgres, pgbouncer_admin
stats_users = stats_user, monitoring_user
stats_period = 60
show_unpooled_stats = 1
show_pool_usage = 1
show_database_usage = 1
show_peer_usage = 1

# Auto-ban and security
autoban = 1
autoban_min_seconds = 60
autoban_penalty_seconds = 3600
autoban_penalty_userlist = /etc/pgbouncer/banned_users.txt
max_packet_size = 16777216

# Connection validation
server_check_delay = 5
server_check_query = SELECT 1
server_reset_query = DISCARD ALL
server_lifetime = 3600
server_idle_timeout = 600

# Performance optimization
mem_pool_size = 4096
mem_pool_timeout = 300
mem_pool_cleanup_delay = 60
max_client_conn = 2000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 10
max_db_connections = 200
max_user_connections = 100

# Advanced features
track_extra_parameters = 1
application_name_add_host = 1
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
autocommit = off
ignore_startup_parameters = 1
