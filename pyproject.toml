[project.urls]
Homepage = "https://dedan.ai"
Documentation = "https://docs.dedan.ai"
Repository = "https://github.com/dedan/dedan-2.0"
"Bug Tracker" = "https://github.com/dedan/dedan-2.0/issues"
Changelog = "https://github.com/dedan/dedan-2.0/blob/main/CHANGELOG.md"

[project.scripts]
dedan = "dedan.main:main"
dedan-server = "dedan.server:run"
dedan-worker = "dedan.worker:run"
dedan-migrate = "dedan.db:migrate"
dedan-test = "pytest tests/"
dedan-lint = "pre-commit run --all-files"
dedan-format = "black . && isort ."
dedan-type-check = "mypy dedan/"
dedan-security-check = "bandit -r dedan/"
dedan-deps-check = "safety check"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dedan*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.toml", "*.txt", "*.md"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | node_modules
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip_glob = ["migrations/*", "venv/*", ".venv/*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
implicit_reexport = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "migrations.*",
    "conftest",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
    "db: marks tests as database tests",
    "redis: marks tests as Redis tests",
    "blockchain: marks tests as blockchain tests",
    "quantum: marks tests as quantum tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/migrations/*",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
fail_under = 95

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = ["tests", "migrations", "venv", ".venv"]
skips = ["B101", "B601"]

[tool.pylint.messages_control]
disable = [
    "C0330",  # Wrong hanging indentation
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0613",  # Redefining name from outer scope
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 7
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
max-parents = 7
max-public-methods = 20

[tool.pylint.imports]
import-graph = true
import-graph-style = "yes"

[tool.flake8]
max-line-length = 88
max-complexity = 10
extend-ignore = ["E203", "W503", "E501", "F401", "F841"]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations",
    "node_modules",
    ".pytest_cache",
    ".tox",
    ".coverage",
    "htmlcov",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations", "venv", ".venv"]
skips = ["B101", "B601"]

[tool.pyright]
include = ["src/**/*.py"]
exclude = ["**/node_modules", "**/tests", "**/migrations"]
reportMissingImports = true
reportMissingTypeStubs = true
pythonVersion = "3.9"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "C", "I", "N", "UP", "B", "A"]
ignore = ["E203", "W503", "E501", "F401", "F841"]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations",
    "node_modules",
    ".pytest_cache",
    ".tox",
    ".coverage",
    "htmlcov",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["F401", "F841"]
"migrations/*" = ["E501", "E203"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I", "N", "UP", "B", "A"]
ignore = ["E203", "W503", "E501", "F401", "F841"]

[tool.ruff.lint.isort]
required-imports = ["typing"]
known-first-party = ["dedan"]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "asyncpg", "redis"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-line-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"
