syntax = "proto3";

package dedan.market;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "google/api/http.proto";

// Market data service for gRPC microservices
service MarketService {
  // Get current market data for a mineral
  rpc GetMarketData(GetMarketDataRequest) returns (GetMarketDataResponse) {
    option (google.api.http) = {
      get: "/v1/market/data/{mineral_id}"
    };
    option (google.api.method) = "GET";
  }

  // Get market data for multiple minerals
  rpc GetBatchMarketData(GetBatchMarketDataRequest) returns (GetBatchMarketDataResponse) {
    option (google.api.http) = {
      post: "/v1/market/batch"
    };
    option (google.api.method) = "POST";
  }

  // Subscribe to real-time market updates
  rpc SubscribeMarketUpdates(SubscribeMarketUpdatesRequest) returns (stream MarketUpdate) {
    option (google.api.http) = {
      get: "/v1/market/subscribe"
    };
    option (google.api.method) = "GET";
  }

  // Get market statistics
  rpc GetMarketStats(GetMarketStatsRequest) returns (GetMarketStatsResponse) {
    option (google.api.http) = {
      get: "/v1/market/stats"
    };
    option (google.api.method) = "GET";
  }

  // Get historical market data
  rpc GetHistoricalMarketData(GetHistoricalMarketDataRequest) returns (GetHistoricalMarketDataResponse) {
    option (google.api.http) = {
      get: "/v1/market/history/{mineral_id}"
    };
    option (google.api.method) = "GET";
  }

  // Get market depth
  rpc GetMarketDepth(GetMarketDepthRequest) returns (GetMarketDepthResponse) {
    option (google.api.http) = {
      get: "/v1/market/depth/{trading_pair_id}"
    };
    option (google.api.method) = "GET";
  }

  // Get market trades
  rpc GetMarketTrades(GetMarketTradesRequest) returns (GetMarketTradesResponse) {
    option (google.api.http) = {
      get: "/v1/market/trades/{trading_pair_id}"
    };
    option (google.api.method) = "GET";
  }

  // Get market order book
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse) {
    option (google.api.http) = {
      get: "/v1/market/orderbook/{trading_pair_id}"
    };
    option (google.api.method) = "GET";
  }
}

// Request messages
message GetMarketDataRequest {
  string mineral_id = 1;
  string currency = 2;  // USD, EUR, etc.
  bool include_history = 3;
  int32 limit = 4;
  string cursor = 5;
}

message GetBatchMarketDataRequest {
  repeated string mineral_ids = 1;
  string currency = 2;
  bool include_history = 3;
  int32 limit = 4;
  string cursor = 5;
}

message SubscribeMarketUpdatesRequest {
  repeated string mineral_ids = 1;
  repeated string trading_pairs = 2;
  string update_type = 3;  // price, volume, trades, orderbook
  int32 update_interval_ms = 4;
  string client_id = 5;
}

message GetMarketStatsRequest {
  repeated string mineral_ids = 1;
  string currency = 2;
  int32 period_hours = 3;
  string granularity = 4;  // minute, hour, day, week, month
}

message GetHistoricalMarketDataRequest {
  string mineral_id = 1;
  string currency = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  string granularity = 5;  // minute, hour, day, week, month
  int32 limit = 6;
  string cursor = 7;
}

message GetMarketDepthRequest {
  string trading_pair_id = 1;
  int32 depth_levels = 2;  // Number of price levels
}

message GetMarketTradesRequest {
  string trading_pair_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  int32 limit = 4;
  string cursor = 5;
}

message GetOrderBookRequest {
  string trading_pair_id = 1;
  int32 depth_levels = 2;
  bool include_own_orders = 3;
}

// Response messages
message GetMarketDataResponse {
  MarketData market_data = 1;
  string cursor = 2;
  bool has_more = 3;
}

message GetBatchMarketDataResponse {
  repeated MarketData market_data = 1;
  string cursor = 2;
  bool has_more = 3;
}

message MarketUpdate {
  string update_type = 1;
  string mineral_id = 2;
  string trading_pair_id = 3;
  oneof data {
    PriceUpdate price_update = 1;
    VolumeUpdate volume_update = 2;
    TradeUpdate trade_update = 3;
    OrderBookUpdate orderbook_update = 4;
  }
  google.protobuf.Timestamp timestamp = 5;
}

message PriceUpdate {
  double price = 1;
  double price_change_24h = 2;
  double price_change_percent_24h = 3;
  double volume_24h = 4;
  double volume_change_24h = 5;
  double volume_change_percent_24h = 6;
}

message VolumeUpdate {
  double volume_24h = 1;
  double volume_change_24h = 2;
  double volume_change_percent_24h = 3;
  int32 trade_count_24h = 4;
}

message TradeUpdate {
  Trade trade = 1;
}

message OrderBookUpdate {
  repeated OrderBookLevel bids = 1;
  repeated OrderBookLevel asks = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message GetMarketStatsResponse {
  repeated MarketStats stats = 1;
}

message GetHistoricalMarketDataResponse {
  repeated HistoricalDataPoint data_points = 1;
  string cursor = 2;
  bool has_more = 3;
}

message GetMarketDepthResponse {
  MarketDepth depth = 1;
}

message GetMarketTradesResponse {
  repeated Trade trades = 1;
  string cursor = 2;
  bool has_more = 3;
}

message GetOrderBookResponse {
  OrderBook order_book = 1;
}

// Data models
message MarketData {
  string mineral_id = 1;
  string symbol = 2;
  string name = 3;
  string category = 4;
  double current_price = 5;
  double price_change_24h = 6;
  double price_change_percent_24h = 7;
  double volume_24h = 8;
  double volume_change_24h = 9;
  double volume_change_percent_24h = 10;
  double market_cap = 11;
  double circulating_supply = 12;
  double max_supply = 13;
  double total_value_locked = 14;
  google.protobuf.Timestamp last_trade_time = 15;
  repeated PricePoint price_history = 16;
}

message MarketStats {
  string mineral_id = 1;
  string period = 2;
  double high_price = 3;
  double low_price = 4;
  double open_price = 5;
  double close_price = 6;
  double volume = 7;
  double market_cap = 8;
  int32 trade_count = 9;
  double average_price = 10;
  double price_volatility = 11;
  google.protobuf.Timestamp start_time = 12;
  google.protobuf.Timestamp end_time = 13;
}

message HistoricalDataPoint {
  google.protobuf.Timestamp timestamp = 1;
  double open_price = 2;
  double high_price = 3;
  double low_price = 4;
  double close_price = 5;
  double volume = 6;
  double market_cap = 7;
}

message MarketDepth {
  string trading_pair_id = 1;
  repeated OrderBookLevel bids = 2;
  repeated OrderBookLevel asks = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message OrderBookLevel {
  double price = 1;
  double quantity = 2;
  int32 order_count = 3;
}

message OrderBook {
  string trading_pair_id = 1;
  repeated OrderBookLevel bids = 2;
  repeated OrderBookLevel asks = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message Trade {
  string trade_id = 1;
  string trading_pair_id = 2;
  string order_id = 3;
  string trade_type = 4;  // buy, sell
  double price = 5;
  double quantity = 6;
  double total_value = 7;
  google.protobuf.Timestamp timestamp = 8;
  string maker_order_id = 9;
  string taker_order_id = 10;
  double fee = 11;
  string fee_currency = 12;
}

message PricePoint {
  google.protobuf.Timestamp timestamp = 1;
  double price = 2;
  double volume = 3;
}
